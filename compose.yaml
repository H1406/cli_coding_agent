services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cli_coding_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cli_coding_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      AGENT_DATABASE_URL: postgresql://postgres:postgres@db:5432/cli_coding_agent
    command: ["--help"]

volumes:
  postgres_data:
